# Windows / MSVC Release コンパイル検証（R-47-a）
#
# 目的:
#   Windows / MSVC での C++ コンパイルエラーを PR 段階で検出し、main がビルド不能に
#   なる時間を最小化する。R-46 では `main` が 2 箇所でコンパイル不能のまま約 5 時間
#   放置された（どの必須チェックも Windows の C++ をビルドしていなかった）。
#
# なぜ oneAPI (MKL/IPP) をインストールしないか:
#   このリポジトリの CMakeLists.txt は `CONVOPEQ_REQUIRE_MKL`（既定 ON）で MKL を必須に
#   できるが、OFF の場合は「MKL が無ければ system aligned allocator を使う」ことが
#   明示的にサポートされている（CMakeLists.txt:71, 79-92, 1724-1738）。
#   GitHub ホステッドランナーには Intel oneAPI が入っておらず、既存 sanitizer-ci の
#   インストーラ取得は失敗すると configure/build ごと skip する（fail-open）。
#   本ワークフローは「依存が無いことを理由に成功扱いする」設計を採らないため、
#   外部 SDK に依存しない **サポート済み構成**（REQUIRE_MKL=OFF）で実際にビルドする。
#   MKL 依存コードパスの検証は既存 sanitizer-ci（oneAPI がある場合のみ）が担い、
#   本ワークフローはそれを変更しない。
#
# 失敗時の原因識別:
#   ビルドログを artifact として保存し、`error C####` / `error LNK####` と
#   そのファイル:行をジョブサマリに抽出する。ツールチェーンが無い場合は
#   configure 前に明示的に fail させる（skip しない）。
#
# 対象ブランチ:
#   `pull_request`（base=main）と `push`（main）。paths フィルタは置かない
#   （どの変更でも必ず走らせる）。

name: Windows MSVC Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject_compile_failure:
        description: "意図的なコンパイル失敗を注入し、検出できることを確認する（検証専用）"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILD_DIR: ${{ github.workspace }}/build-ci

jobs:
  # ---------------------------------------------------------------------------
  # 1) 製品構成（Release / 既定の診断設定 = OFF）: アプリ本体をビルドする
  # ---------------------------------------------------------------------------
  release-product:
    name: Windows MSVC / Release (product)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC (cl.exe) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            try { choco install ninja -y --no-progress } catch { Write-Host "choco install failed: $_" }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            python -m pip install --quiet ninja
          }
          ninja --version

      - name: Verify toolchain (fail closed)
        shell: pwsh
        run: |
          $missing = @()
          foreach ($tool in @('cl.exe', 'cmake.exe', 'ninja.exe')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += $tool }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required build tools: $($missing -join ', ') — this job never skips a build for missing dependencies."
          }
          Write-Host "cl.exe : $((Get-Command cl.exe).Source)"
          cl.exe 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version

      - name: Configure (Release, no MKL)
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCONVOPEQ_REQUIRE_MKL=OFF `
            -DCONVOPEQ_ENABLE_RUNTIME_DIAGNOSTICS=OFF 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed ($LASTEXITCODE)" }
          # MKL/IPP の状態が「不明」のまま進まないことを確認する（明示された状態のみ許容）
          $mkl = Select-String -Path configure.log -Pattern 'MKL: (found|not found)'
          $ipp = Select-String -Path configure.log -Pattern 'Intel IPP (found|not found)'
          if (-not $mkl) { throw "CMake did not report a definite MKL state" }
          if (-not $ipp) { throw "CMake did not report a definite IPP state" }
          $mkl | ForEach-Object { Write-Host $_.Line }
          $ipp | ForEach-Object { Write-Host $_.Line }

      - name: Build Release (target ConvoPeq)
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build $env:BUILD_DIR --config Release --target ConvoPeq 2>&1 | Tee-Object -FilePath build.log
          $rc = $LASTEXITCODE
          $errors = Select-String -Path build.log -Pattern 'error (C\d+|LNK\d+)' | Select-Object -First 40
          if ($errors) {
            "### Compile/link errors" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            $errors | ForEach-Object { $_.Line } | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          exit $rc

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-product-logs
          path: |
            configure.log
            build.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2) 診断 ON 構成（R-01 の計測コードを含む）: AudioEngineHarness をビルドする
  # ---------------------------------------------------------------------------
  release-harness-diag:
    name: Windows MSVC / Release (harness, diag)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC (cl.exe) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            try { choco install ninja -y --no-progress } catch { Write-Host "choco install failed: $_" }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            python -m pip install --quiet ninja
          }
          ninja --version

      - name: Verify toolchain (fail closed)
        shell: pwsh
        run: |
          $missing = @()
          foreach ($tool in @('cl.exe', 'cmake.exe', 'ninja.exe')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += $tool }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required build tools: $($missing -join ', ') — this job never skips a build for missing dependencies."
          }
          cl.exe 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version

      - name: Configure (Release, no MKL, runtime diagnostics ON)
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCONVOPEQ_REQUIRE_MKL=OFF `
            -DCONVOPEQ_ENABLE_RUNTIME_DIAGNOSTICS=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed ($LASTEXITCODE)" }
          $mkl = Select-String -Path configure.log -Pattern 'MKL: (found|not found)'
          $ipp = Select-String -Path configure.log -Pattern 'Intel IPP (found|not found)'
          if (-not $mkl) { throw "CMake did not report a definite MKL state" }
          if (-not $ipp) { throw "CMake did not report a definite IPP state" }
          $mkl | ForEach-Object { Write-Host $_.Line }
          $ipp | ForEach-Object { Write-Host $_.Line }

      - name: Build Release (target AudioEngineHarness)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build $env:BUILD_DIR --config Release --target AudioEngineHarness 2>&1 | Tee-Object -FilePath build.log
          $rc = $LASTEXITCODE
          $errors = Select-String -Path build.log -Pattern 'error (C\d+|LNK\d+)' | Select-Object -First 40
          if ($errors) {
            "### Compile/link errors" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            $errors | ForEach-Object { $_.Line } | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          exit $rc

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-harness-logs
          path: |
            configure.log
            build.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3) 検出能力の確認（手動実行専用）: 意図的なコンパイル失敗を注入し、
  #    ビルドが実際に落ちることと、原因がログに現れることを確認する。
  #    製品コードは変更しない（ランナーの作業ツリーのみ。コミットしない）。
  # ---------------------------------------------------------------------------
  probe-intentional-failure:
    name: Windows MSVC / probe (intentional failure, dispatch only)
    if: github.event_name == 'workflow_dispatch' && inputs.inject_compile_failure == true
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC (cl.exe) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            try { choco install ninja -y --no-progress } catch { Write-Host "choco install failed: $_" }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            python -m pip install --quiet ninja
          }
          ninja --version

      - name: Configure (Release, no MKL)
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCONVOPEQ_REQUIRE_MKL=OFF 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed ($LASTEXITCODE)" }

      - name: Inject an intentional compile error (runner workspace only)
        shell: pwsh
        run: |
          $target = 'src/audioengine/AudioEngine.CtorDtor.cpp'
          Add-Content -Path $target -Value "`n#error R47A_INTENTIONAL_COMPILE_FAILURE"
          Get-Content $target -Tail 2
          git status --porcelain

      - name: Build must fail on the injected error
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build $env:BUILD_DIR --config Release --target ConvoPeq 2>&1 | Tee-Object -FilePath build-probe.log
          $rc = $LASTEXITCODE
          if ($rc -eq 0) {
            throw "PROBE FAILED: the intentional compile error was NOT detected (build exit 0)."
          }
          $hit = Select-String -Path build-probe.log -Pattern 'R47A_INTENTIONAL_COMPILE_FAILURE' -SimpleMatch
          if (-not $hit) {
            throw "PROBE INCONCLUSIVE: build failed (exit $rc) but the injected marker is not in the log."
          }
          Write-Host "PROBE OK: intentional compile error detected (build exit $rc)."
          $hit | Select-Object -First 3 | ForEach-Object { Write-Host $_.Line }
          "PROBE OK: build exit $rc, marker reported in the log." | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-probe-logs
          path: |
            configure.log
            build-probe.log
          if-no-files-found: warn

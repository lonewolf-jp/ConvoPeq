# Windows / MSVC Release コンパイル検証（R-47-a）
#
# 目的:
#   Windows / MSVC での C++ コンパイルエラーを PR 段階で検出し、main がビルド不能に
#   なる時間を最小化する。R-46 では `main` が 2 箇所でコンパイル不能のまま約 5 時間
#   放置された（どの必須チェックも Windows の C++ をビルドしていなかった）。
#
# 依存関係（oneAPI / MKL / IPP）— 実測にもとづく結論:
#   このリポジトリの Windows ビルドは MKL と IPP の **ヘッダが必須** である。
#     - src/DiagnosticsConfig.h:48 は `#if defined(JUCE_DSP_USE_INTEL_MKL)` で <mkl.h> を取り込む。
#       JUCE/modules/juce_dsp/juce_dsp.h:156-157 が「未定義なら 0 を定義」するため、
#       この `defined()` は常に真になる（= CONVOPEQ_REQUIRE_MKL=OFF でも mkl.h が要る）。
#     - src/FFTBackend.h:22, src/MklFftEvaluator.h:17, src/MKLNonUniformConvolver.h:48,
#       src/MainApplication.cpp:29 が <ipp.h> を無条件に include する。
#   → 「SDK 無しでビルド」は成立しないため、CI では Intel oneAPI を実際に導入する。
#   既存 sanitizer-ci.yml のインストーラ URL (aptmirror.nasm.me) は既に名前解決できない。
#   本ワークフローは公式 winget パッケージ (Intel.OneAPI.BaseToolkit) を使い、
#   導入後に mkl.h / ipp.h の実在を確認する。無ければ **fail**（skip しない）。
#
# 失敗時の原因識別:
#   ビルドログを artifact として保存し、`error C####` / `error LNK####` を
#   Job Summary に抽出する。
#
# 対象ブランチ:
#   `pull_request`（base=main）と `push`（main）。paths フィルタは置かない。

name: Windows MSVC Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject_compile_failure:
        description: "意図的なコンパイル失敗を注入し、検出できることを確認する（検証専用）"
        type: boolean
        default: false
      run_selected_tests:
        description: "ビルド後に HeadlessAudioPathVerification / AudioEngineHarness を実行する（R-49 調査用）"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILD_DIR: ${{ github.workspace }}/build-ci
  ONEAPI_ROOT_DIR: "C:\\Program Files (x86)\\Intel\\oneAPI"

jobs:
  # ---------------------------------------------------------------------------
  # 0) 変更種別の判定: 文書だけの変更では重いビルドを省略する
  #
  #    required check (Windows MSVC / Release) は job の条件スキップで
  #    "Success" として報告される（workflow 自体を paths で止めると Pending の
  #    ままになりマージがブロックされる）。判定に失敗した場合はビルドする側へ
  #    倒し、安全側に倒す。
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Classify the change
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          if ! git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # -z は非 ASCII のパスを引用しない（既定だと "doc/...\351\240\205..." に
          # なる）。tr で NUL 区切りを 1 行 1 パスに戻す。
          files=$(git -c core.quotepath=false diff --name-only -z "$base...HEAD" | tr '\0' '\n' || true)
          if [ -z "$files" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -qvE '^(doc/|.*\.md$|\.memories/|\.x64dbg-mcp/|\.zcode/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 1) Release コンパイル（出荷構成: 診断 OFF）
  # ---------------------------------------------------------------------------
  release:
    name: Windows MSVC / Release
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC (cl.exe) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            try { choco install ninja -y --no-progress } catch { Write-Host "choco install failed: $_" }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            python -m pip install --quiet ninja
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            throw "ninja is not available — this job never skips a build for missing tools."
          }
          ninja --version

      # R-101: oneAPI (MKL + IPP) の導入をキャッシュする。
      #   MKL/IPP の lib と include は自己完結しており、MKLROOT/IPPROOT を明示するため
      #   インストール先の mkl\latest と ipp\latest をそのまま保存・復元できる。
      #   hit: 復元だけで 4 点チェックを通る（winget を実行しない）
      #   miss: 従来どおり winget で導入し、ジョブ終了時にキャッシュへ保存する
      #   失敗時: 復元できなければ 4 点チェックが失敗し、winget 導入へフォールバックする
      - name: Restore oneAPI (MKL + IPP) cache
        id: oneapi-cache
        uses: actions/cache@v4
        with:
          # latest は Intel インストーラが作るシンボリックリンクのため、
          # 実体のバージョン付きディレクトリを保存する（復元後に junction を作り直す）。
          path: |
            C:\Program Files (x86)\Intel\oneAPI\mkl\2025.1
            C:\Program Files (x86)\Intel\oneAPI\ipp\2022.1
          key: oneapi-mkl-ipp-${{ runner.os }}-mkl2025.1-ipp2022.1-v2

      - name: Install Intel oneAPI (MKL + IPP) via winget
        shell: pwsh
        run: |
          $oneapi = $env:ONEAPI_ROOT_DIR
          Write-Host "oneAPI cache hit: ${{ steps.oneapi-cache.outputs.cache-hit }}"
          # latest が無い（キャッシュ復元直後）場合は実体への junction を作る。
          foreach ($comp in @('mkl','ipp')) {
            $latest = Join-Path $oneapi "$comp\latest"
            if (Test-Path $latest) { continue }
            $ver = Get-ChildItem (Join-Path $oneapi $comp) -Directory -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -match '^\d{4}\.\d+$' } |
                   Sort-Object Name -Descending | Select-Object -First 1
            if ($ver) {
              cmd /c mklink /J "$latest" "$($ver.FullName)" | Out-Null
              Write-Host "created junction: $latest -> $($ver.FullName)"
            }
          }
          # 必要物: ヘッダだけでなく import ライブラリも確認する（ヘッダのみで成功扱いにしない）。
          $required = [ordered]@{
            'mkl.h'        = "$oneapi\mkl\latest\include\mkl.h"
            'ipp.h'        = "$oneapi\ipp\latest\include\ipp.h"
            'mkl_core.lib' = "$oneapi\mkl\latest\lib\mkl_core.lib"
            'ippcore.lib'  = "$oneapi\ipp\latest\lib\ippcore.lib"
          }
          function Get-Missing {
            @($required.GetEnumerator() | Where-Object { -not (Test-Path $_.Value) } | ForEach-Object { $_.Key })
          }
          $missing = Get-Missing
          if ($missing.Count -eq 0) {
            Write-Host "oneAPI (MKL + IPP) already present and complete (headers + import libraries)."
            exit 0
          }
          Write-Host "missing before install: $($missing -join ', ')"
          winget --version
          # 公式 winget パッケージ。Base Toolkit に MKL と IPP が含まれる。
          winget install --id Intel.OneAPI.BaseToolkit -e --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          # winget の終了コードは成功判定に使わない（導入済み・部分成功でも非 0 を返す実測がある）。
          Write-Host "winget exit=$LASTEXITCODE (not the success criterion)"
          $missing = Get-Missing
          if ($missing.Count -ne 0) {
            Get-ChildItem "$oneapi" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  oneAPI dir: $($_.Name)" }
            throw ("Intel oneAPI (MKL + IPP) is not usable: missing " + ($missing -join ', ') + " - refusing to skip the build.")
          }
          Write-Host "oneAPI verified: headers and import libraries present."
          exit 0

      - name: Export oneAPI environment
        shell: pwsh
        run: |
          $oneapi = $env:ONEAPI_ROOT_DIR
          $mkl = Join-Path $oneapi 'mkl\latest'
          $ipp = Join-Path $oneapi 'ipp\latest'
          $mklVer = (Get-ChildItem (Join-Path $oneapi 'mkl') -Directory |
                     Where-Object { $_.Name -match '^\d{4}\.\d+$' } |
                     Sort-Object Name -Descending | Select-Object -First 1)
          $ippVer = (Get-ChildItem (Join-Path $oneapi 'ipp') -Directory |
                     Where-Object { $_.Name -match '^\d{4}\.\d+$' } |
                     Sort-Object Name -Descending | Select-Object -First 1)
          Write-Host "MKL dir: $mkl  (versioned: $($mklVer.Name))"
          Write-Host "IPP dir: $ipp  (versioned: $($ippVer.Name))"
          "MKLROOT=$mkl"        | Out-File -Append -FilePath $env:GITHUB_ENV
          "IPPROOT=$ipp"        | Out-File -Append -FilePath $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$mkl;$mkl\lib\cmake\mkl;$ipp;$ipp\lib\cmake\ipp" |
            Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Verify toolchain (fail closed)
        shell: pwsh
        run: |
          $missing = @()
          foreach ($tool in @('cl.exe', 'cmake.exe', 'ninja.exe')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += $tool }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required build tools: $($missing -join ', ')"
          }
          cl.exe 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version
          Write-Host "MKLROOT=$env:MKLROOT"
          Write-Host "IPPROOT=$env:IPPROOT"

      - name: Configure (Release, MKL required)
        shell: pwsh
        env:
          # R-111: CI ランナーには音声デバイスが無い。CMakeLists.txt は
          #   `DEFINED ENV{CONVO_CI_BUILD}` のとき HeadlessAudioPathVerification を登録しない
          #   設計（"CI環境は音声デバイスがないためスキップ"）なので、この CI ワークフローでのみ
          #   定義する。ローカルビルドは環境変数を設定しないため影響を受けない。
          CONVO_CI_BUILD: "1"
        run: |
          cmake -S . -B $env:BUILD_DIR -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCONVOPEQ_REQUIRE_MKL=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed ($LASTEXITCODE)" }
          # MKL/IPP が「見つかった」と明示されること（不明のまま進ませない）
          $mkl = Select-String -Path configure.log -Pattern 'MKL: found'
          $ipp = Select-String -Path configure.log -Pattern 'Intel IPP found'
          if (-not $mkl) { throw "CMake did not report MKL as found (CONVOPEQ_REQUIRE_MKL=ON)." }
          if (-not $ipp) { throw "CMake did not report IPP as found." }
          $mkl | ForEach-Object { Write-Host $_.Line }
          $ipp | ForEach-Object { Write-Host $_.Line }

      - name: Build Release (ConvoPeq)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # JuceHeader.h は ConvoPeq ターゲットの生成物。同一 ninja 呼び出しで
          # AudioEngineHarness と並列に走らせると生成前に include して失敗するため、
          # 明示的に順序を分ける（クリーンツリーでの実測）。
          cmake --build $env:BUILD_DIR --config Release --target ConvoPeq 2>&1 |
            Tee-Object -FilePath build-product.log
          $rc = $LASTEXITCODE
          $errors = Select-String -Path build-product.log -Pattern 'error (C\d+|LNK\d+)' | Select-Object -First 40
          if ($errors) {
            "### Compile/link errors (ConvoPeq)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            $errors | ForEach-Object { $_.Line } | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          exit $rc

      - name: Build Release (AudioEngineHarness)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build $env:BUILD_DIR --config Release --target AudioEngineHarness 2>&1 |
            Tee-Object -FilePath build-harness.log
          $rc = $LASTEXITCODE
          $errors = Select-String -Path build-harness.log -Pattern 'error (C\d+|LNK\d+)' | Select-Object -First 40
          if ($errors) {
            "### Compile/link errors (AudioEngineHarness)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            $errors | ForEach-Object { $_.Line } | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          exit $rc

      # R-49: ランナーに音声出力デバイスが存在するかを記録する（診断専用）。
      - name: Enumerate audio devices (diagnostics, dispatch only)
        if: inputs.run_selected_tests == true
        shell: pwsh
        run: |
          Write-Host "=== Win32_SoundDevice ==="
          try { Get-CimInstance Win32_SoundDevice | Select-Object Name, Status, Manufacturer | Format-Table -AutoSize | Out-String | Write-Host }
          catch { Write-Host "Win32_SoundDevice query failed: $_" }
          $render = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render'
          if (Test-Path $render) {
            $n = (Get-ChildItem $render | Measure-Object).Count
            Write-Host "MMDevices\\Audio\\Render entries: $n"
          } else {
            Write-Host "MMDevices\\Audio\\Render key not found"
          }

      # R-49: ASan を有効にしない構成で、CI ランナー上での 2 テストの挙動を確認する。
      #   workflow_dispatch + run_selected_tests=true のときだけ実行する（通常の PR では走らない）。
      - name: Run selected tests (diagnostics, dispatch only)
        if: inputs.run_selected_tests == true
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = ""
          ctest --test-dir $env:BUILD_DIR -C Release -R "^(HeadlessAudioPathVerification|AudioEngineHarness)$" --output-on-failure 2>&1 |
            Tee-Object -FilePath selected-tests.log
          $rc = $LASTEXITCODE
          "### Selected tests (Release, ASan OFF)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-Content selected-tests.log -Tail 40 | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          exit $rc

      # R-49: CLI smoke が読む ConvoPeq.log を取得する（診断専用）。
      - name: Show ConvoPeq log (diagnostics, dispatch only)
        if: always() && inputs.run_selected_tests == true
        shell: pwsh
        run: |
          $log = Join-Path $env:BUILD_DIR 'ConvoPeq_artefacts\Release\ConvoPeq.log'
          if (Test-Path $log) {
            Write-Host "log: $log"
            Get-Content $log -Tail 60 | Write-Host
            Copy-Item $log (Join-Path $env:GITHUB_WORKSPACE 'ConvoPeq-run.log') -Force
          } else {
            Write-Host "no log at $log"
            Get-ChildItem $env:BUILD_DIR -Recurse -Filter 'ConvoPeq.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "found: $($_.FullName)" }
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-release-logs
          path: |
            configure.log
            build-product.log
            build-harness.log
            selected-tests.log
            ConvoPeq-run.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2) 検出能力の確認（手動実行専用）
  #    ランナーの作業ツリーにのみ #error を注入し、ビルドが実際に落ちることと
  #    原因がログに出ることを確認する。コミットしない（製品コードは変更しない）。
  # ---------------------------------------------------------------------------
  probe-intentional-failure:
    name: Windows MSVC / probe (intentional failure, dispatch only)
    if: github.event_name == 'workflow_dispatch' && inputs.inject_compile_failure == true
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC (cl.exe) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            try { choco install ninja -y --no-progress } catch { Write-Host "choco install failed: $_" }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            python -m pip install --quiet ninja
          }
          ninja --version

      - name: Restore oneAPI (MKL + IPP) cache
        id: oneapi-cache
        uses: actions/cache@v4
        with:
          # latest は Intel インストーラが作るシンボリックリンクのため、
          # 実体のバージョン付きディレクトリを保存する（復元後に junction を作り直す）。
          path: |
            C:\Program Files (x86)\Intel\oneAPI\mkl\2025.1
            C:\Program Files (x86)\Intel\oneAPI\ipp\2022.1
          key: oneapi-mkl-ipp-${{ runner.os }}-mkl2025.1-ipp2022.1-v2

      - name: Install Intel oneAPI (MKL + IPP) via winget
        shell: pwsh
        run: |
          $oneapi = $env:ONEAPI_ROOT_DIR
          Write-Host "oneAPI cache hit: ${{ steps.oneapi-cache.outputs.cache-hit }}"
          # latest が無い（キャッシュ復元直後）場合は実体への junction を作る。
          foreach ($comp in @('mkl','ipp')) {
            $latest = Join-Path $oneapi "$comp\latest"
            if (Test-Path $latest) { continue }
            $ver = Get-ChildItem (Join-Path $oneapi $comp) -Directory -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -match '^\d{4}\.\d+$' } |
                   Sort-Object Name -Descending | Select-Object -First 1
            if ($ver) {
              cmd /c mklink /J "$latest" "$($ver.FullName)" | Out-Null
              Write-Host "created junction: $latest -> $($ver.FullName)"
            }
          }
          # 必要物: ヘッダだけでなく import ライブラリも確認する（ヘッダのみで成功扱いにしない）。
          $required = [ordered]@{
            'mkl.h'        = "$oneapi\mkl\latest\include\mkl.h"
            'ipp.h'        = "$oneapi\ipp\latest\include\ipp.h"
            'mkl_core.lib' = "$oneapi\mkl\latest\lib\mkl_core.lib"
            'ippcore.lib'  = "$oneapi\ipp\latest\lib\ippcore.lib"
          }
          function Get-Missing {
            @($required.GetEnumerator() | Where-Object { -not (Test-Path $_.Value) } | ForEach-Object { $_.Key })
          }
          $missing = Get-Missing
          if ($missing.Count -eq 0) {
            Write-Host "oneAPI (MKL + IPP) already present and complete (headers + import libraries)."
            exit 0
          }
          Write-Host "missing before install: $($missing -join ', ')"
          winget --version
          winget install --id Intel.OneAPI.BaseToolkit -e --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          Write-Host "winget exit=$LASTEXITCODE (not the success criterion)"
          $missing = Get-Missing
          if ($missing.Count -ne 0) {
            Get-ChildItem "$oneapi" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  oneAPI dir: $($_.Name)" }
            throw ("Intel oneAPI (MKL + IPP) is not usable: missing " + ($missing -join ', ') + " - refusing to skip.")
          }
          Write-Host "oneAPI verified: headers and import libraries present."
          exit 0

      - name: Export oneAPI environment
        shell: pwsh
        run: |
          $oneapi = $env:ONEAPI_ROOT_DIR
          "MKLROOT=$oneapi\mkl\latest" | Out-File -Append -FilePath $env:GITHUB_ENV
          "IPPROOT=$oneapi\ipp\latest" | Out-File -Append -FilePath $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$oneapi\mkl\latest;$oneapi\mkl\latest\lib\cmake\mkl;$oneapi\ipp\latest;$oneapi\ipp\latest\lib\cmake\ipp" |
            Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Configure (Release, MKL required)
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCONVOPEQ_REQUIRE_MKL=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed ($LASTEXITCODE)" }

      - name: Inject an intentional compile error (runner workspace only)
        shell: pwsh
        run: |
          $target = 'src/audioengine/AudioEngine.CtorDtor.cpp'
          Add-Content -Path $target -Value "`n#error R47A_INTENTIONAL_COMPILE_FAILURE"
          Get-Content $target -Tail 2
          git status --porcelain

      - name: Build must fail on the injected error
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build $env:BUILD_DIR --config Release --target ConvoPeq 2>&1 |
            Tee-Object -FilePath build-probe.log
          $rc = $LASTEXITCODE
          if ($rc -eq 0) {
            throw "PROBE FAILED: the intentional compile error was NOT detected (build exit 0)."
          }
          $hit = Select-String -Path build-probe.log -Pattern 'R47A_INTENTIONAL_COMPILE_FAILURE' -SimpleMatch
          if (-not $hit) {
            throw "PROBE INCONCLUSIVE: build failed (exit $rc) but the injected marker is not in the log."
          }
          Write-Host "PROBE OK: intentional compile error detected (build exit $rc)."
          $hit | Select-Object -First 3 | ForEach-Object { Write-Host $_.Line }
          "PROBE OK: build exit $rc, marker reported in the log." |
            Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-probe-logs
          path: |
            configure.log
            build-probe.log
          if-no-files-found: warn

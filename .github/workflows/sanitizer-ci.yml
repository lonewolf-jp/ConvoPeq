# Sanitizer CI — ASan (Windows MSVC) + TSan (Linux Clang, best-effort)
#
# ADD-4: ASan/TSan CI job分離
# ASan-CMAKE-1〜8 に基づく設定。
# ASan job は Release 性能ゲートに使用しない（ASan-CMAKE-8）。
#
# ★ ASan 構成 (2026-08-03 改定): MSVC ASan は CRT と一致した ASan ランタイム DLL が必須。
#   - /MDd (Debug) は clang_rt.asan_dbg_dynamic-*.dll、/MD は clang_rt.asan_dynamic-*.dll。
#   - 旧構成 (Debug /MDd) は CRT 不一致で DDDQ testReclaimPerformance() がハングしたため、
#     標準構成を **RelWithDebInfo (/MD)** に統一する（CMakeLists.txt の
#     MSVC_RUNTIME_LIBRARY per-config 設定と連動）。
#   - 実行前に clang_rt.asan_dynamic-x86_64.dll をテスト exe と同じディレクトリへ展開する。
#
# Practical Stable 設計:
# - ASan: Windows MSVC で完全実行（RelWithDebInfo + /MD）。動的CRT切替でASan互換。
# - TSan: Linux Clang で best-effort 実行。MKL/IPP 非依存のテストのみ対象。
#         環境不足時は graceful skip（PR ブロックしない）。

name: Sanitizer CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

env:
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  #-----------------------------------------------------------
  # RelWithDebInfo-ASan: Windows MSVC, AddressSanitizer
  # MSVC ASan requires dynamic CRT (/MD), which conflicts with
  # the static CRT (/MT) used in normal Release builds.
  # This job is therefore separate from the regular Release job.
  #
  # ★ 2026-08-03: Debug (/MDd) → RelWithDebInfo (/MD) に変更。
  #   /MDd は clang_rt.asan_dbg_dynamic-*.dll を要求するが、展開しているのは
  #   clang_rt.asan_dynamic-*.dll (release) のため CRT 不一致でハングしていた。
  #   RelWithDebInfo (/MD) は展開済み release DLL と一致し、ASan 実行が安定する。
  #-----------------------------------------------------------
  relwithdebinfo-asan:
    name: "RelWithDebInfo ASan (MSVC, /MD)"
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      # ★ R-50 (2026-10-29): ASan ジョブに限定して VB-CABLE を導入する。
      #   背景: `42 - HeadlessAudioPathVerification` はホステッドランナーに音声レンダー
      #   エンドポイントが無いため失敗し続けていた（ASan は 50/51 のまま）。
      #   実証プローブ（.github/workflows/vbcable-probe.yml, run 40838686832）で、ホステッド
      #   ランナー上でもデバイス導入後にコールバックが発生し、既存テストがその
      #   まま PASS することを確認済み。
      #
      #   固定: サードパーティ Action は完全なコミット SHA に固定する（@main は使わない）。
      #   固定先 6ec0facd8780f0f463d7dc2fcfd630e06eb1fc0b（2026-09-02）の action.yml は
      #     1. audiosrv を起動
      #     2. LetAppsAccessMicrophone=1（プライバシー ポリシー）
      #     3. VBCABLE.cer を TrustedPublisher に追加 → ドライバを展開 →
      #        devcon install vbMmeCable64_win10.inf VBAudioVACWDM
      #   ドライバと証明書は同リポジトリ同梱（実行時の外部ダウンロード無し）。
      #   使い捨てのホステッドランナー上でのみ TrustedPublisher に追加する。
      #
      #   範囲: **ASan ジョブのみ**。通常の Release ジョブ
      #   （windows-msvc-build.yml）には広げない。
      #   ASan は引き続き非必須チェックで、51/51 になっても必須化しない。
      - name: Install VB-CABLE (pinned commit SHA, ASan job only)
        uses: AlekseyMartynov/action-vbcable-win@6ec0facd8780f0f463d7dc2fcfd630e06eb1fc0b

      # Fail-closed 1/3: レンダーエンドポイントの列挙。導入コマンドが成功しても
      # エンドポイントが現れなければジョブを失敗させる（終了コードだけに依存しない）。
      - name: Verify audio render endpoint exists (fail closed)
        shell: pwsh
        run: |
          $render = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render'
          $n = if (Test-Path $render) { (Get-ChildItem $render | Measure-Object).Count } else { 0 }
          Get-CimInstance Win32_SoundDevice |
            Select-Object Name, Status, Manufacturer |
            Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "MMDevices\Audio\Render entries after VB-CABLE = $n"
          if ($n -lt 1) {
            throw "VB-CABLE installation did not create a render endpoint (entries=$n). Failing closed."
          }

      # oneAPI (MKL + IPP) は必須。src/DiagnosticsConfig.h は <mkl.h> を、
      # src/FFTBackend.h ほかは <ipp.h> を要求する（SDK 無しでは configure 以前にビルドできない）。
      # GitHub ホステッドランナーには oneAPI が入っていない。
      #
      # R-48: 以前はサードパーティミラー (aptmirror.nasm.me) からインストーラを取得していたが、
      #   そのホストは現在名前解決できず、continue-on-error + installed=false により
      #   Configure/Build/Test が skip されたままジョブが success になっていた
      #   （= ASan が一度も実行されていない）。ここを fail-closed に改める。
      #   公式 winget パッケージで導入し、mkl.h / ipp.h の実在で判定する
      #   （winget の終了コードだけに依存しない）。
      - name: Install Intel oneAPI (MKL + IPP) via winget
        shell: pwsh
        run: |
          $oneapiRoot = "C:\Program Files (x86)\Intel\oneAPI"
          if ((Test-Path "$oneapiRoot\mkl\latest\include\mkl.h") -and (Test-Path "$oneapiRoot\ipp\latest\include\ipp.h")) {
            Write-Host "Intel oneAPI (MKL + IPP) already present."
            exit 0
          }
          winget --version
          winget install --id Intel.OneAPI.BaseToolkit -e --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          Write-Host "winget exit=$LASTEXITCODE"
          $mkl = Test-Path "$oneapiRoot\mkl\latest\include\mkl.h"
          $ipp = Test-Path "$oneapiRoot\ipp\latest\include\ipp.h"
          Write-Host "mkl.h present: $mkl"
          Write-Host "ipp.h present: $ipp"
          if (-not ($mkl -and $ipp)) {
            throw "Intel oneAPI (MKL + IPP) is not usable — refusing to skip the ASan build."
          }

      - name: Export oneAPI environment
        shell: pwsh
        run: |
          $oneapiRoot = "C:\Program Files (x86)\Intel\oneAPI"
          Write-Host "MKLROOT=$oneapiRoot\mkl\latest"
          Write-Host "IPPROOT=$oneapiRoot\ipp\latest"
          "MKLROOT=$oneapiRoot\mkl\latest" | Out-File -Append -FilePath $env:GITHUB_ENV
          "IPPROOT=$oneapiRoot\ipp\latest" | Out-File -Append -FilePath $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$oneapiRoot\mkl\latest;$oneapiRoot\mkl\latest\lib\cmake\mkl;$oneapiRoot\ipp\latest;$oneapiRoot\ipp\latest\lib\cmake\ipp" |
            Out-File -Append -FilePath $env:GITHUB_ENV

      # ★ 2026-08-08: MSVC コマンドライン環境をセットアップ（cl.exe を PATH に追加）。
      #   GitHub Actions windows runner では cl は既定で PATH に無いため、このステップがないと
      #   -DCMAKE_CXX_COMPILER=cl の CMake configure が "cl is not a full path" で失敗する。
      #   ilammy/msvc-dev-cmd@v1 は環境を $GITHUB_ENV 経由で後続ステップへ永続化する。
      - name: Set up MSVC command line environment (cl)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake with ASan
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DENABLE_ASAN=ON `
            -DCONVOPEQ_REQUIRE_MKL=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed ($LASTEXITCODE)" }
          $mkl = Select-String -Path configure.log -Pattern 'MKL: found'
          $ipp = Select-String -Path configure.log -Pattern 'Intel IPP found'
          if (-not $mkl) { throw "CMake did not report MKL as found (CONVOPEQ_REQUIRE_MKL=ON)." }
          if (-not $ipp) { throw "CMake did not report IPP as found." }
          $mkl | ForEach-Object { Write-Host $_.Line }
          $ipp | ForEach-Object { Write-Host $_.Line }

      - name: Build (RelWithDebInfo)
        shell: pwsh
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config RelWithDebInfo 2>&1 | Tee-Object -FilePath build.log
          $rc = $LASTEXITCODE
          $errors = Select-String -Path build.log -Pattern 'error (C\d+|LNK\d+)' | Select-Object -First 40
          if ($errors) {
            "### Compile/link errors" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            $errors | ForEach-Object { $_.Line } | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          exit $rc

      # ★ ASan-CMAKE-9: MSVC は ASan ランタイム DLL をテスト exe へ自動コピーしないため、
      #   clang_rt.asan_dynamic-x86_64.dll を手動で展開する（/MD 構成と一致）。
      #   DLL は MSVC ツールチェーンの bin\Hostx64\x64 配下にある。
      - name: Deploy ASan runtime DLL
        shell: pwsh
        run: |
          $asanDll = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $asanDll) {
            throw "ASan runtime DLL (clang_rt.asan_dynamic-x86_64.dll) not found in MSVC toolchain"
          }
          $targetDir = Join-Path ${{ env.BUILD_DIR }} "RelWithDebInfo"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -LiteralPath $asanDll.FullName -Destination (Join-Path $targetDir "clang_rt.asan_dynamic-x86_64.dll") -Force
          Write-Host "Deployed ASan DLL from $($asanDll.FullName)"

      - name: Run tests with ASan
        run: ctest --test-dir ${{ env.BUILD_DIR }} -C RelWithDebInfo --output-on-failure
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=0"

      # Fail-closed 2/3, 3/3: callbacks>0 と blockSamples>0。
      #   既存テスト `HeadlessAudioPathVerification`（cli-smoke-test.ps1
      #   -RequireAudioCallbacks）は callbacks>0 を検査するが blockSamples は見ない。
      #   テスト基準は変更せず（除外・緩和・時間延長はしない）、CI 側で
      #   記録済みの生ログを検査して fail-closed にする。
      - name: Verify audio callback telemetry (fail closed)
        if: always()
        shell: pwsh
        run: |
          # ★ JUCE の実行ファイルは <build>/ConvoPeq_artefacts/<Config>/ に出力される
          #   （実測: build-rwdi/ConvoPeq_artefacts/RelWithDebInfo/ConvoPeq.log）。
          #   アプリは ConvoPeq.log を「実行ファイルと同じディレクトリ」に書くため、
          #   artefact 側を第一候補にし、無ければ build 配下を再帰探索する。
          $candidates = @(
            (Join-Path "${{ env.BUILD_DIR }}" "ConvoPeq_artefacts\RelWithDebInfo\ConvoPeq.log"),
            (Join-Path "${{ env.BUILD_DIR }}" "RelWithDebInfo\ConvoPeq.log")
          )
          $log = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $log) {
            $found = Get-ChildItem -LiteralPath "${{ env.BUILD_DIR }}" -Recurse -Filter "ConvoPeq.log" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($found) { $log = $found.FullName }
          }
          if (-not $log) {
            Write-Host "=== searched: ${{ env.BUILD_DIR }} ==="
            Get-ChildItem -LiteralPath "${{ env.BUILD_DIR }}" -Recurse -Filter "*.log" -File -ErrorAction SilentlyContinue |
              Select-Object -First 30 FullName, Length, LastWriteTime |
              Format-Table -AutoSize | Out-String | Write-Host
            throw "CLI log (ConvoPeq.log) not found under the build directory - cannot prove audio callbacks (fail closed)."
          }
          Write-Host "ConvoPeq.log = $log"
          $lines = @(Select-String -LiteralPath $log -Pattern '\[CLI_PERF_RAW\] callbacks=')
          Write-Host "CLI_PERF_RAW lines = $($lines.Count)"
          $lines | Select-Object -Last 5 | ForEach-Object { Write-Host $_.Line }
          $cb = @($lines | Where-Object { $_.Line -match 'callbacks=([1-9][0-9]*)' })
          $bs = @($lines | Where-Object { $_.Line -match 'blockSamples=([1-9][0-9]*)' })
          Write-Host "callbacks>0 lines = $($cb.Count) / blockSamples>0 lines = $($bs.Count)"
          if ($cb.Count -lt 1) {
            throw "No [CLI_PERF_RAW] line with callbacks>0 - audio callbacks never ran (fail closed)."
          }
          if ($bs.Count -lt 1) {
            throw "No [CLI_PERF_RAW] line with blockSamples>0 - no audio block was processed (fail closed)."
          }
          Write-Host "Audio path proven: callbacks>0 and blockSamples>0."

      - name: Upload ASan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs
          path: |
            configure.log
            build.log
            ${{ env.BUILD_DIR }}/**/ConvoPeq.log
          if-no-files-found: warn


  #-----------------------------------------------------------
  # Debug-TSan: Linux Clang, best-effort ThreadSanitizer
  #
  # TSan detects data races in multi-threaded code.
  # MSVC does not support TSan; Clang on Linux is required.
  #
  # Practical Stable: このプロジェクトは MKL/IPP/JUCE ASIO に
  # 依存するため Linux でのフルビルドは不可能。そのため
  # MKL/IPP に依存しないテスト（ISRRetire テスト等）のみを
  # 対象とし、ビルド困難な場合は graceful skip する。
  #-----------------------------------------------------------
  debug-tsan:
    name: "Debug TSan (Clang, best-effort)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # ISR: 環境不足でも PR をブロックしない

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          # ★ ISR: azure.archive.ubuntu.com がタイムアウトする問題に対するリトライロジック
          for i in 1 2 3; do
            sudo apt-get update && break || {
              echo "apt-get update attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done
          sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev cmake

      - name: Check MKL/IPP availability
        id: check_deps
        run: |
          if ! command -v clang++ &> /dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=clang not found"
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Configure CMake with TSan (minimal target)
        if: steps.check_deps.outputs.skip != 'true'
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -G "Ninja Multi-Config" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_TSAN=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            2>&1 || echo "CMake configuration failed (expected on Linux without MKL/IPP)"

      - name: Build and test (best-effort)
        if: steps.check_deps.outputs.skip != 'true'
        run: |
          # Practical Stable ISR: MKL/IPP 非依存の ISR テストのみを対象とする。
          # configure が失敗していたら graceful skip。
          if [ ! -f "${{ env.BUILD_DIR }}/build.ninja" ]; then
            echo "[TSan] Skipped (no build configured — MKL/IPP not available on Linux)"
            exit 0
          fi
          # 利用可能な ISR テストをビルド
          cmake --build "${{ env.BUILD_DIR }}" --config Debug --target ISRSemanticValidationTests 2>/dev/null || \
          { echo "[TSan] Build failed (expected without MKL)"; exit 0; }
          ctest --test-dir "${{ env.BUILD_DIR }}" -C Debug --output-on-failure 2>/dev/null || \
          echo "[TSan] No TSan-compatible tests executed"

      - name: Report TSan status
        if: always()
        run: |
          echo "## TSan (best-effort) results" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ubuntu-latest, Clang" >> $GITHUB_STEP_SUMMARY
          echo "- Note: Full build requires MKL/IPP (Windows-only). TSan runs on available targets." >> $GITHUB_STEP_SUMMARY

# Sanitizer CI — ASan (Windows MSVC) + TSan (Linux Clang, best-effort)
#
# ADD-4: ASan/TSan CI job分離
# ASan-CMAKE-1〜8 に基づく設定。
# ASan job は Release 性能ゲートに使用しない（ASan-CMAKE-8）。
#
# ★ ASan 構成 (2026-08-03 改定): MSVC ASan は CRT と一致した ASan ランタイム DLL が必須。
#   - /MDd (Debug) は clang_rt.asan_dbg_dynamic-*.dll、/MD は clang_rt.asan_dynamic-*.dll。
#   - 旧構成 (Debug /MDd) は CRT 不一致で DDDQ testReclaimPerformance() がハングしたため、
#     標準構成を **RelWithDebInfo (/MD)** に統一する（CMakeLists.txt の
#     MSVC_RUNTIME_LIBRARY per-config 設定と連動）。
#   - 実行前に clang_rt.asan_dynamic-x86_64.dll をテスト exe と同じディレクトリへ展開する。
#
# Practical Stable 設計:
# - ASan: Windows MSVC で完全実行（RelWithDebInfo + /MD）。動的CRT切替でASan互換。
# - TSan: Linux Clang で best-effort 実行。MKL/IPP 非依存のテストのみ対象。
#         環境不足時は graceful skip（PR ブロックしない）。

name: Sanitizer CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

env:
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  #-----------------------------------------------------------
  # RelWithDebInfo-ASan: Windows MSVC, AddressSanitizer
  # MSVC ASan requires dynamic CRT (/MD), which conflicts with
  # the static CRT (/MT) used in normal Release builds.
  # This job is therefore separate from the regular Release job.
  #
  # ★ 2026-08-03: Debug (/MDd) → RelWithDebInfo (/MD) に変更。
  #   /MDd は clang_rt.asan_dbg_dynamic-*.dll を要求するが、展開しているのは
  #   clang_rt.asan_dynamic-*.dll (release) のため CRT 不一致でハングしていた。
  #   RelWithDebInfo (/MD) は展開済み release DLL と一致し、ASan 実行が安定する。
  #-----------------------------------------------------------
  relwithdebinfo-asan:
    name: "RelWithDebInfo ASan (MSVC, /MD)"
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # ★ ASan-CMAKE-4 修正（2026-07-31）: windows-latest には Intel oneAPI が未インストールのため、
      #   CMakeLists.txt:833 の find_package(MKL REQUIRED CONFIG ...) が configure 時に失敗する。
      #   oneAPI をセットアップして MKLROOT を設定することで解決する。
      #   （ConvoPeq は MKL 必須依存のため、MKL 無しでは asan ジョブは成立しない）
      - name: Set up Intel oneAPI (MKL)
        uses: intel/setup-intel-oneapi@v2
        with:
          components: mkl
          version: "2026.0"

      - name: Configure CMake with ASan
        shell: pwsh
        run: |
          cmake -B ${{ env.BUILD_DIR }} `
            -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DENABLE_ASAN=ON

      - name: Build (RelWithDebInfo)
        run: cmake --build ${{ env.BUILD_DIR }} --config RelWithDebInfo

      # ★ ASan-CMAKE-9: MSVC は ASan ランタイム DLL をテスト exe へ自動コピーしないため、
      #   clang_rt.asan_dynamic-x86_64.dll を手動で展開する（/MD 構成と一致）。
      #   DLL は MSVC ツールチェーンの bin\Hostx64\x64 配下にある。
      - name: Deploy ASan runtime DLL
        shell: pwsh
        run: |
          $asanDll = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $asanDll) {
            Write-Error "ASan runtime DLL (clang_rt.asan_dynamic-x86_64.dll) not found in MSVC toolchain"
            exit 1
          }
          $targetDir = Join-Path ${{ env.BUILD_DIR }} "RelWithDebInfo"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -LiteralPath $asanDll.FullName -Destination (Join-Path $targetDir "clang_rt.asan_dynamic-x86_64.dll") -Force
          Write-Host "Deployed ASan DLL from $($asanDll.FullName)"

      - name: Run tests with ASan
        run: ctest --test-dir ${{ env.BUILD_DIR }} -C RelWithDebInfo --output-on-failure
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=0"

  #-----------------------------------------------------------
  # Debug-TSan: Linux Clang, best-effort ThreadSanitizer
  #
  # TSan detects data races in multi-threaded code.
  # MSVC does not support TSan; Clang on Linux is required.
  #
  # Practical Stable: このプロジェクトは MKL/IPP/JUCE ASIO に
  # 依存するため Linux でのフルビルドは不可能。そのため
  # MKL/IPP に依存しないテスト（ISRRetire テスト等）のみを
  # 対象とし、ビルド困難な場合は graceful skip する。
  #-----------------------------------------------------------
  debug-tsan:
    name: "Debug TSan (Clang, best-effort)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # ISR: 環境不足でも PR をブロックしない

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev cmake

      - name: Check MKL/IPP availability
        id: check_deps
        run: |
          if ! command -v clang++ &> /dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=clang not found"
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Configure CMake with TSan (minimal target)
        if: steps.check_deps.outputs.skip != 'true'
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -G "Ninja Multi-Config" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_TSAN=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            2>&1 || echo "CMake configuration failed (expected on Linux without MKL/IPP)"

      - name: Build and test (best-effort)
        if: steps.check_deps.outputs.skip != 'true'
        run: |
          # Practical Stable ISR: MKL/IPP 非依存の ISR テストのみを対象とする。
          # configure が失敗していたら graceful skip。
          if [ ! -f "${{ env.BUILD_DIR }}/build.ninja" ]; then
            echo "[TSan] Skipped (no build configured — MKL/IPP not available on Linux)"
            exit 0
          fi
          # 利用可能な ISR テストをビルド
          cmake --build "${{ env.BUILD_DIR }}" --config Debug --target ISRSemanticValidationTests 2>/dev/null || \
          { echo "[TSan] Build failed (expected without MKL)"; exit 0; }
          ctest --test-dir "${{ env.BUILD_DIR }}" -C Debug --output-on-failure 2>/dev/null || \
          echo "[TSan] No TSan-compatible tests executed"

      - name: Report TSan status
        if: always()
        run: |
          echo "## TSan (best-effort) results" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ubuntu-latest, Clang" >> $GITHUB_STEP_SUMMARY
          echo "- Note: Full build requires MKL/IPP (Windows-only). TSan runs on available targets." >> $GITHUB_STEP_SUMMARY

# Soak CI — 長時間/高負荷の耐久検証（手動トリガーのみ）
#
# Work91 §7-7: AudioEngineHarness の soak シナリオ（S1/S2b/S3/S4/S5）を
# workflow_dispatch で手動実行する。
#
# 設計方針（doc/work91/soak-test-design.md §6）:
# - push ごとの CI には載せない（実行時間が長いため）。
# - 手動（Actions タブの "Run workflow"）からのみ実行する。
# - inputs.scenario で単一シナリオ or 全シナリオを選択可能。
# - 将来安定してきたら schedule (cron) で夜間実行に移行検討。
#
# 実行対象:
#   build/Release/AudioEngineHarness.exe --soak [--scenario=<name>]
#   scenario: all / s1 / s2b / s3 / s4 / s5

name: Soak CI

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "実行するシナリオ（all / s1 / s2b / s3 / s4 / s5）"
        type: choice
        default: "all"
        options:
          - all
          - s1
          - s2b
          - s3
          - s4
          - s5

env:
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  soak:
    name: "Soak (${{ github.event.inputs.scenario || 'all' }})"
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # ConvoPeq は MKL/IPP 必須依存のため Intel oneAPI をセットアップ
      # ★ 2026-08-06: intel/setup-intel-oneapi アクションは deprecated/リポジトリ削除されたため
      #   Chocolatey で Intel oneAPI Base Kit (MKL+IPP 含む) をインストールし、
      #   setvars.bat で環境変数を設定する。
      # ★ 2026-08-08: Intel oneAPI Base Kit のインストール可能性を確認。
      #   oneAPI がない場合は MKLNonUniformConvolver ビルド失敗を回避するため、
      #   Configure/Build/Run を graceful skip する（Practical Stable ISR 方針）。
      #   oneAPI Base Kit チェックを id 付きで実行し、後段のステップが条件付き。
      - name: Install Intel oneAPI Base Kit (MKL + IPP)
        id: install_oneapi
        shell: pwsh
        run: |
          choco install intel-oneapi-basekit -y --no-progress --no-color
          $oneapiRoot = "C:\Program Files (x86)\Intel\oneAPI"
          if (Test-Path "$oneapiRoot\mkl\latest\lib\cmake\mkl\MKLConfig.cmake") {
            Write-Output "installed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "installed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Initialize Intel oneAPI environment
        shell: pwsh
        run: |
          $oneapiRoot = "C:\Program Files (x86)\Intel\oneAPI"
          if (Test-Path "$oneapiRoot\setvars.bat") {
            cmd /c """$oneapiRoot\setvars.bat"" intel64 && set" | ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") {
                Set-Item -Path "env:$($matches[1])" -Value $matches[2]
              }
            }
          }

      # ★ 2026-08-08: MSVC コマンドライン環境をセットアップ（cl.exe を PATH に追加）。
      #   windows runner では cl は既定で PATH に無いため、-DCMAKE_CXX_COMPILER=cl の
      #   configure が "cl is not a full path" で失敗する。環境を $GITHUB_ENV 経由で永続化。
      - name: Set up MSVC command line environment (cl)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Release)
        if: steps.install_oneapi.outputs.installed == 'true'
        shell: pwsh
        run: |
          cmake -B ${{ env.BUILD_DIR }} `
            -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCONVOPEQ_ENABLE_ISR_TESTS=ON

      - name: Build AudioEngineHarness (Release)
        if: steps.install_oneapi.outputs.installed == 'true'
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --target AudioEngineHarness -j 1

      - name: Run Soak scenarios
        if: steps.install_oneapi.outputs.installed == 'true'
        shell: pwsh
        run: |
          $scenario = "${{ github.event.inputs.scenario }}"
          if ([string]::IsNullOrEmpty($scenario)) { $scenario = "all" }
          $exe = Join-Path ${{ env.BUILD_DIR }} "Release\AudioEngineHarness.exe"
          & $exe --soak "--scenario=$scenario"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Soak scenario '$scenario' FAILED (exit=$LASTEXITCODE)"
            exit 1
          }

      - name: Report soak results
        if: always()
        run: |
          echo "## Soak results (${{ github.event.inputs.scenario || 'all' }})" >> $GITHUB_STEP_SUMMARY
          echo "- Platform: windows-latest (MSVC), Release /MD" >> $GITHUB_STEP_SUMMARY
          echo "- Command: AudioEngineHarness --soak --scenario=${{ github.event.inputs.scenario || 'all' }}" >> $GITHUB_STEP_SUMMARY

      - name: Report skip (oneAPI unavailable)
        if: steps.install_oneapi.outputs.installed != 'true'
        shell: pwsh
        run: |
          Write-Host "## Soak CI skipped" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- Reason: Intel oneAPI not available on this runner." >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- MKLNonUniformConvolver requires mkl.h/ipp.h (Intel oneAPI)." >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- Install Intel oneAPI Base Kit + set CONVOPEQ_REQUIRE_MKL accordingly to run." >> $env:GITHUB_STEP_SUMMARY
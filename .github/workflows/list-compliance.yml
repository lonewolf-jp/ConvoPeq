name: list-compliance

on:
  pull_request:
    paths:
      - src/**
      - doc/list.md
      - .github/scripts/check-list-compliance.ps1
      - .github/scripts/check-src-atomic-dotcall.ps1
      - .github/scripts/check-src-size-mul-cast.ps1
      - .github/workflows/list-compliance.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - doc/list.md
      - .github/scripts/check-list-compliance.ps1
      - .github/scripts/check-src-atomic-dotcall.ps1
      - .github/scripts/check-src-size-mul-cast.ps1
      - .github/workflows/list-compliance.yml

permissions:
  contents: read

jobs:
  compliance-list-md:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run list.md compliance checks
        shell: pwsh
        run: |
          $script = ".github/scripts/check-list-compliance.ps1"
          if (Test-Path $script) { & $script } else { Write-Host "::warning::$script not found — skip" }

      - name: Run size multiplication cast guard (src only)
        shell: pwsh
        run: |
          $script = ".github/scripts/check-src-size-mul-cast.ps1"
          if (Test-Path $script) { & $script } else { Write-Host "::warning::$script not found — skip" }
